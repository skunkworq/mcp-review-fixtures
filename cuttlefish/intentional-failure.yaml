apiVersion: cuttlefish.dev/v1alpha1
kind: Workflow
metadata:
  name: mcp-review-intentional-failure
  description: Synthetic public-review fixture; deliberately exits 13 for failure inspection.
spec:
  edges: []
  nodes:
    - id: expected-failure
      image: alpine:3.20
      run:
        shell: sh-e
        timeout: 1m
      script: |
        printf 'MCP review fixture: intentional sample failure.\n'
        printf 'Expected exit code: 13. No production workload is involved.\n'
        exit 13
  triggers:
    - kind: manual
